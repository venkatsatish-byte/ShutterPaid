[build]
  command = "node scripts/build.mjs"
  publish = "."

# Short public booking links: /book/<slug> -> book.html?p=<slug>
[[redirects]]
  from = "/book/:slug"
  to = "/book.html?p=:slug"
  status = 302

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/config.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
